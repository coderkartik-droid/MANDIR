# render.yaml — Render.com deployment configuration
# Docs: https://render.com/docs/blueprint-spec
#
# HOW AUTO-DEPLOY WORKS:
#   1. You push a commit to GitHub (including CMS-authored commits from Decap).
#   2. Render detects the push via GitHub webhook and triggers a new build.
#   3. `npm run build` compiles the Vite app; the `dist/` folder is served.
#
# FIRST-TIME SETUP:
#   - Connect this repo in the Render dashboard (New → Static Site).
#   - Set Root Directory to the repo root.
#   - Render will pick up this file automatically.

services:
  - type: web
    name: shree-baba-sidhnath-mandir
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true

    # Node version (must match local dev)
    envVars:
      - key: NODE_VERSION
        value: "20"

    # Auto-deploy on every push to main
    autoDeploy: true
    branch: main

    # SPA routing — every path falls back to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Static asset headers
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /media/*
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /audio/*
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /images/*
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /admin/*
        name: X-Frame-Options
        value: "SAMEORIGIN"

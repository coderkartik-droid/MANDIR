# render.yaml — Render.com deployment configuration
# Docs: https://render.com/docs/blueprint-spec
#
# ARCHITECTURE:
#   A single Render Web Service runs the FastAPI backend (backend/main.py).
#   In production FastAPI also serves the built React frontend from dist/,
#   so the site and the /api content endpoints share one origin — no CORS
#   issues, no second service, no database.
#
# HOW DEPLOYMENT WORKS:
#   1. You push a commit to GitHub.
#   2. Render runs the build command: installs Python deps, installs npm
#      deps, and builds the React app into dist/.
#   3. Render starts uvicorn; FastAPI serves dist/ + the JSON content API.
#   4. The Admin Panel (⚙️ icon) saves content straight to backend/content
#      *.json files and uploads media to backend/media/ on the server.

services:
  - type: web
    name: shree-baba-sidhnath-mandir
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: NODE_VERSION
        value: "20"
      - key: ENVIRONMENT
        value: production
      # Optional: comma-separated extra allowed origins for CORS.
      # Not required in production because frontend + API share one origin.
      - key: CORS_ORIGINS
        sync: false

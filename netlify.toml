[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Dev server (local `netlify dev`) ──────────────────────────────────────────
[dev]
  command   = "npm run dev"
  port      = 5173
  publish   = "dist"

# ── SPA catch-all: serve index.html for every non-asset route ─────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  # Exclude real files so assets, admin, and media are served directly
  conditions = { Role = ["visitor"] }

# ── Admin panel: always serve public/admin/index.html ─────────────────────────
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/admin/"
  to     = "/admin/index.html"
  status = 200
  force  = true

# ── Security headers for every page ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "DENY"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# ── Looser frame policy for /admin/ (Decap CMS needs iframes) ─────────────────
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# ── Aggressive caching for hashed static assets ───────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

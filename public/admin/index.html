<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      CMS_BRANCH is injected at build time by the Vite plugin (scripts/injectCmsBranch.js).
      It reads the GIT_BRANCH / RENDER_GIT_BRANCH / CF_PAGES_BRANCH env var at build time.
      Falls back to "main" if none is set.
    -->
    <meta name="cms-branch" content="__CMS_BRANCH__" />
    <title>Content Manager — Shree Baba Sidhnath Mandir</title>
    <style>
      body { margin: 0; padding: 0; background: #0a1628; color: #f5f5dc; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <script>
      /**
       * Runtime CMS configuration.
       *
       * Branch resolution order:
       *   1. ?branch=<name> query param   (manual override for testing)
       *   2. <meta name="cms-branch">     (injected at build time from env)
       *   3. "main"                        (safe universal fallback)
       *
       * Repo is read from the same meta tag pattern so a single env change
       * (VITE_CMS_REPO) updates both the main site and the admin panel.
       */
      (function () {
        // ── Branch resolution ────────────────────────────────────────────────
        var params   = new URLSearchParams(window.location.search);
        var metaBranch = document.querySelector('meta[name="cms-branch"]');
        var rawBranch  = metaBranch ? metaBranch.getAttribute('content') : '';
        var branch = params.get('branch')
          || (rawBranch && rawBranch !== '__CMS_BRANCH__' ? rawBranch : '')
          || 'main';

        // ── Full declarative CMS config object ───────────────────────────────
        // Mirrors public/admin/config.yml exactly but is fully dynamic.
        // config.yml is kept as documentation / fallback; this JS config wins.
        var cmsConfig = {
          backend: {
            name: 'github',
            repo: 'YOUR_GITHUB_USERNAME/YOUR_REPO_NAME',
            branch: branch,
            base_url: 'https://decapcms.org',
            auth_endpoint: '/api/auth',
          },

          // Default global media — overridden per-collection below
          media_folder:  'public/media/images/temple',
          public_folder: '/media/images/temple',

          publish_mode: 'editorial_workflow',
          locale: 'en',

          slug: {
            encoding: 'ascii',
            clean_accents: true,
            sanitize_replacement: '_',
          },

          collections: [
            // ── 1. Temple Information ────────────────────────────────────────
            {
              name: 'temple-info', label: 'Temple Information',
              label_singular: 'Temple Info',
              folder: 'content/temple-info', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false }, summary: '{{name}}',
              fields: [
                { label: 'Temple Name (English)',       name: 'name',          widget: 'string' },
                { label: 'Temple Name (Hindi/Sanskrit)',name: 'hindiName',     widget: 'string' },
                { label: 'Subtitle',                    name: 'subTitle',      widget: 'string' },
                { label: 'Tagline',                     name: 'tagline',       widget: 'string' },
                { label: 'Sacred Mantra',               name: 'mantra',        widget: 'string' },
                { label: 'Short Description',           name: 'description',   widget: 'text'   },
                { label: 'Location',                    name: 'location',      widget: 'string' },
                { label: 'Established / Era',           name: 'established',   widget: 'string' },
                { label: 'Principal Deity',             name: 'deity',         widget: 'string' },
                { label: 'Founder',                     name: 'founder',       widget: 'string' },
                { label: 'Temple History',              name: 'templeHistory', widget: 'markdown'},
                { label: 'About the Temple',            name: 'aboutTemple',   widget: 'markdown'},
                { label: 'Daily Timings',               name: 'templeTimings', widget: 'string',
                  hint: 'E.g. 05:00 AM – 09:00 PM (Daily)' },
                { label: 'Special Notes for Pilgrims',  name: 'specialNotes',  widget: 'text'   },
              ],
            },

            // ── 2. Home Page ─────────────────────────────────────────────────
            {
              name: 'home-page', label: 'Home Page', label_singular: 'Home Page',
              folder: 'content/home-page', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              fields: [
                { label: 'Hero Title',        name: 'heroTitle',       widget: 'string'   },
                { label: 'Hero Subtitle',     name: 'heroSubtitle',    widget: 'string'   },
                { label: 'Hero Description',  name: 'heroDescription', widget: 'text'     },
                { label: 'Welcome Text',      name: 'welcomeText',     widget: 'markdown' },
                { label: 'Button Text',       name: 'buttonText',      widget: 'string'   },
                { label: 'Button Link',       name: 'buttonLink',      widget: 'string'   },
              ],
            },

            // ── 3. Festivals ─────────────────────────────────────────────────
            {
              name: 'festivals', label: 'Festivals', label_singular: 'Festival',
              folder: 'content/festivals', create: true,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              summary: '{{name}} – {{month}}',
              sortable_fields: ['name', 'month'],
              fields: [
                { label: 'Festival ID',        name: 'id',          widget: 'string',
                  hint: 'Lowercase, no spaces. E.g. mahashivratri' },
                { label: 'Name (English)',     name: 'name',        widget: 'string'   },
                { label: 'Name (Hindi)',       name: 'hindi',       widget: 'string'   },
                { label: 'Month / Season',     name: 'month',       widget: 'string'   },
                { label: 'Tag Line',           name: 'tag',         widget: 'string'   },
                { label: 'Card Gradient CSS',  name: 'color',       widget: 'string',
                  default: 'from-amber-500/20 to-navy-900' },
                { label: 'Card Border CSS',    name: 'border',      widget: 'string',
                  default: 'border-amber-500/40' },
                { label: 'Description',        name: 'description', widget: 'markdown' },
                { label: 'Sacred Rituals',     name: 'rituals',     widget: 'list',
                  summary: '{{fields.ritual}}',
                  field: { label: 'Ritual', name: 'ritual', widget: 'string' } },
              ],
            },

            // ── 4. Gallery ───────────────────────────────────────────────────
            {
              name: 'gallery', label: 'Photo Gallery', label_singular: 'Gallery Image',
              folder: 'content/gallery', create: true,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              summary: '{{title}} ({{category}})',
              sortable_fields: ['order', 'title', 'category'],
              fields: [
                { label: 'Image ID (unique)',  name: 'id',          widget: 'number', value_type: 'int' },
                { label: 'Title',             name: 'title',       widget: 'string' },
                { label: 'Subtitle',          name: 'subTitle',    widget: 'string' },
                { label: 'Category',          name: 'category',    widget: 'select',
                  options: ['Architecture', 'Sacred Nature', 'Spiritual Grove', 'Heritage'] },
                { label: 'Image',             name: 'src',         widget: 'image',
                  media_folder: '/public/media/images/gallery',
                  public_folder: '/media/images/gallery' },
                { label: 'Description',       name: 'description', widget: 'text'   },
                { label: 'Aspect Ratio',      name: 'aspect',      widget: 'select',
                  options: ['landscape', 'portrait', 'square'], default: 'landscape' },
                { label: 'Sort Order',        name: 'order',       widget: 'number', value_type: 'int', default: 0 },
                { label: 'Highlight Tags',    name: 'highlights',  widget: 'list',
                  summary: '{{fields.highlight}}',
                  field: { label: 'Highlight', name: 'highlight', widget: 'string' } },
              ],
            },

            // ── 5. Videos ────────────────────────────────────────────────────
            {
              name: 'videos', label: 'Videos', label_singular: 'Video',
              folder: 'content/videos', create: true,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              summary: '{{title}}',
              sortable_fields: ['order', 'title'],
              fields: [
                { label: 'Title',          name: 'title',       widget: 'string' },
                { label: 'Video File or URL', name: 'src',      widget: 'string',
                  hint: '/media/video/filename.mp4 or a YouTube URL' },
                { label: 'Thumbnail Image',   name: 'thumbnail', widget: 'image', required: false,
                  media_folder: '/public/media/images/temple',
                  public_folder: '/media/images/temple' },
                { label: 'Duration (display)', name: 'duration',  widget: 'string', required: false,
                  hint: 'Auto-filled by the media optimizer. E.g. 3:42' },
                { label: 'Resolution',         name: 'resolution',widget: 'string', required: false,
                  hint: 'Auto-filled. E.g. 1920×1080' },
                { label: 'File Size',          name: 'fileSize',  widget: 'string', required: false,
                  hint: 'Auto-filled. E.g. 42 MB' },
                { label: 'Description',        name: 'description',widget: 'text'   },
                { label: 'Sort Order',         name: 'order',     widget: 'number', value_type: 'int', default: 0 },
              ],
            },

            // ── 6. Music Playlist ────────────────────────────────────────────
            {
              name: 'music-playlist', label: 'Music Playlist', label_singular: 'Track',
              folder: 'content/music-playlist', create: true,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              summary: '{{order}}. {{title}}',
              sortable_fields: ['order', 'title'],
              fields: [
                { label: 'Track ID',           name: 'id',          widget: 'string',
                  hint: 'Lowercase, no spaces. E.g. sanctum-bansuri' },
                { label: 'Title (English)',    name: 'title',       widget: 'string' },
                { label: 'Title (Hindi)',      name: 'hindi',       widget: 'string' },
                { label: 'Category',           name: 'category',    widget: 'string',
                  hint: 'E.g. Temple Ambience, Divine Instrumental' },
                { label: 'Audio File Path',    name: 'src',         widget: 'string',
                  hint: '/media/audio/filename.mp3  —  place MP3 in public/media/audio/' },
                { label: 'Duration (display)', name: 'duration',    widget: 'string',
                  hint: 'Auto-filled by media optimizer. E.g. 12:40' },
                { label: 'Duration (seconds)', name: 'durationSec', widget: 'number', value_type: 'int' },
                { label: 'File Size',          name: 'fileSize',    widget: 'string', required: false,
                  hint: 'Auto-filled. E.g. 18 MB' },
                { label: 'Bitrate',            name: 'bitrate',     widget: 'string', required: false,
                  hint: 'Auto-filled. E.g. 320 kbps' },
                { label: 'Format',             name: 'format',      widget: 'string', required: false,
                  hint: 'Auto-filled. E.g. MP3' },
                { label: 'Symbol / Emoji',     name: 'symbol',      widget: 'string', default: '🎵' },
                { label: 'Tag Line',           name: 'tag',         widget: 'string' },
                { label: 'Short Description',  name: 'description', widget: 'text'   },
                { label: 'Waveform Color',     name: 'color',       widget: 'string', default: '#D4AF37',
                  hint: 'Hex color. E.g. #D4AF37' },
                { label: 'Sort Order',         name: 'order',       widget: 'number', value_type: 'int', default: 0 },
              ],
            },

            // ── 7. Contact Information ───────────────────────────────────────
            {
              name: 'contact-info', label: 'Contact Information', label_singular: 'Contact Info',
              folder: 'content/contact-info', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              fields: [
                { label: 'Primary Phone',      name: 'phone',           widget: 'string' },
                { label: 'Alternate Phone',    name: 'alternatePhone',  widget: 'string' },
                { label: 'Email',              name: 'email',           widget: 'string' },
                { label: 'Website',            name: 'website',         widget: 'string' },
                { label: 'Full Address',       name: 'address',         widget: 'text'   },
                { label: 'GPS Coordinates',    name: 'coordinates',     widget: 'string' },
                { label: 'Latitude',           name: 'latitude',        widget: 'string' },
                { label: 'Longitude',          name: 'longitude',       widget: 'string' },
                { label: 'Emergency Contact',  name: 'emergencyContact',widget: 'string' },
                { label: 'By Road',            name: 'byRoad',          widget: 'text'   },
                { label: 'By Train',           name: 'byTrain',         widget: 'text'   },
                { label: 'By Air',             name: 'byAir',           widget: 'text'   },
                { label: 'Facilities',         name: 'facilities',      widget: 'list',
                  field: { label: 'Facility', name: 'facility', widget: 'string' } },
                { label: 'Etiquette Rules',    name: 'etiquette',       widget: 'list',
                  field: { label: 'Rule', name: 'rule', widget: 'string' } },
              ],
            },

            // ── 8. Google Maps ───────────────────────────────────────────────
            {
              name: 'maps', label: 'Google Maps Settings', label_singular: 'Map Settings',
              folder: 'content/maps', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              fields: [
                { label: 'Google Maps Search URL',     name: 'googleMapsUrl', widget: 'string' },
                { label: 'Google Maps Directions URL', name: 'directionsLink',widget: 'string' },
                { label: 'Latitude',                   name: 'latitude',      widget: 'string' },
                { label: 'Longitude',                  name: 'longitude',     widget: 'string' },
                { label: 'Temple Marker Label',        name: 'templeMarker',  widget: 'string' },
                { label: 'Default Zoom Level (1–20)',  name: 'zoomLevel',     widget: 'number',
                  value_type: 'int', default: 15 },
              ],
            },

            // ── 9. Social Links ──────────────────────────────────────────────
            {
              name: 'social-links', label: 'Social Links', label_singular: 'Social Links',
              folder: 'content/social-links', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              fields: [
                { label: 'Facebook URL',           name: 'facebook',  widget: 'string' },
                { label: 'Instagram URL',          name: 'instagram', widget: 'string' },
                { label: 'YouTube URL',            name: 'youtube',   widget: 'string' },
                { label: 'WhatsApp Number or URL', name: 'whatsapp', widget: 'string' },
                { label: 'Email',                  name: 'email',     widget: 'string' },
              ],
            },

            // ── 10. Featured Images ──────────────────────────────────────────
            {
              name: 'images', label: 'Featured Images', label_singular: 'Images Config',
              folder: 'content/images', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              fields: [
                { label: 'Hero Image', name: 'heroImage', widget: 'image',
                  media_folder: '/public/media/images/hero',
                  public_folder: '/media/images/hero' },
                { label: 'Background Image', name: 'backgroundImage', widget: 'image', required: false,
                  media_folder: '/public/media/images/backgrounds',
                  public_folder: '/media/images/backgrounds' },
                { label: 'Logo / Icon', name: 'logo', widget: 'image', required: false,
                  media_folder: '/public/media/images/icons',
                  public_folder: '/media/images/icons' },
                { label: 'Temple Photo Carousel', name: 'templeImages', widget: 'list',
                  field: { label: 'Image', name: 'image', widget: 'image',
                    media_folder: '/public/media/images/temple',
                    public_folder: '/media/images/temple' } },
                { label: 'Festival Images', name: 'festivalImages', widget: 'list',
                  field: { label: 'Image', name: 'image', widget: 'image',
                    media_folder: '/public/media/images/festivals',
                    public_folder: '/media/images/festivals' } },
              ],
            },

            // ── 11. Theme Colors ─────────────────────────────────────────────
            {
              name: 'theme-colors', label: 'Theme Colors', label_singular: 'Theme Colors',
              folder: 'content/theme-colors', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              fields: [
                { label: 'Primary Color (Deep Navy)', name: 'primary',    widget: 'color', enableAlpha: false, default: '#1e3a5f' },
                { label: 'Secondary Color (Gold)',     name: 'secondary',  widget: 'color', enableAlpha: false, default: '#D4AF37' },
                { label: 'Gold Accent',               name: 'goldAccent', widget: 'color', enableAlpha: false, default: '#FFD700' },
                { label: 'Background Color',          name: 'background', widget: 'color', enableAlpha: false, default: '#0a1628' },
                { label: 'Body Text Color',           name: 'text',       widget: 'color', enableAlpha: false, default: '#f5f5dc' },
                { label: 'Glow / Aura Color',         name: 'glow',       widget: 'color', enableAlpha: false, default: '#D4AF37' },
                { label: 'Button Color',              name: 'button',     widget: 'color', enableAlpha: false, default: '#D4AF37' },
              ],
            },

            // ── 12. Animation Settings ───────────────────────────────────────
            {
              name: 'animation-settings', label: 'Animation Settings',
              label_singular: 'Animation Settings',
              folder: 'content/animation-settings', create: false,
              slug: '{{slug}}', format: 'frontmatter', extension: 'md',
              editor: { preview: false },
              fields: [
                { label: 'Rain Effect',              name: 'rain',          widget: 'boolean', default: false },
                { label: 'Fog / Mist Effect',        name: 'fog',           widget: 'boolean', default: false },
                { label: 'Floating Particles',       name: 'particles',     widget: 'boolean', default: true  },
                { label: 'Bell Swing Animation',     name: 'bellAnimation', widget: 'boolean', default: true  },
                { label: 'Flower Petals Drift',      name: 'flowerPetals',  widget: 'boolean', default: false },
                { label: 'Fireflies (Evening)',      name: 'fireflies',     widget: 'boolean', default: true  },
                { label: 'Bloom / Glow PostFX',      name: 'bloom',         widget: 'boolean', default: true  },
                { label: 'Music Visualizer',         name: 'music',         widget: 'boolean', default: true  },
                { label: 'Cinematic Camera Motion',  name: 'cameraMotion',  widget: 'boolean', default: true  },
              ],
            },
          ],
        };

        // ── Apply config to Decap CMS ────────────────────────────────────────
        // window.CMS_MANUAL_INIT signals Decap to skip the YAML file and use
        // the object passed to CMS.init({ config: … }) instead.
        window.CMS_MANUAL_INIT = true;

        // Store config globally; init() is called after the script tag loads.
        window.__CMS_CONFIG__ = cmsConfig;
      })();
    </script>

    <!--
      Decap CMS — GitHub backend (OAuth via Decap's implicit OAuth proxy)
      Docs: https://decapcms.org/docs/github-backend/
    -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Init with the JS config object (branch is already resolved above)
      CMS.init({ config: window.__CMS_CONFIG__ });
    </script>
  </body>
</html>

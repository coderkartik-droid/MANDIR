# ─────────────────────────────────────────────────────────────────────────────
# Decap CMS — Static YAML reference / fallback
#
# ⚠️  The CANONICAL configuration is in public/admin/index.html.
#     That file builds the full config as a JS object at runtime and calls
#     CMS.init({ config: … }), which lets us:
#       • Resolve the Git branch from env vars without hardcoding it.
#       • Override any value without redeploying the YAML.
#
# This file is kept so that:
#   • Developers can read the full schema at a glance.
#   • Decap's config validator / linter tools still work on the project.
#   • It acts as a fallback if JS is disabled (rare edge case).
#
# Branch resolution order (see index.html for details):
#   1. ?branch=<name>  query param  (manual override)
#   2. <meta name="cms-branch">     (injected at build from GIT_BRANCH env var)
#   3. "main"                        (universal fallback)
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: coderkartik-droid/MANDIR
  # branch is intentionally omitted here — resolved at runtime in index.html
  base_url: https://decapcms.org
  auth_endpoint: /api/auth

# Default global media upload target (overridden per-collection in index.html)
media_folder:  "public/media/images/temple"
public_folder: "/media/images/temple"

publish_mode: editorial_workflow
locale: "en"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "_"

# Full collection schema documented below for reference.
# Actual runtime config lives in index.html — keep both in sync.

collections:

  - name: "temple-info"
    label: "Temple Information"
    folder: "content/temple-info"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Temple Name (English)",        name: "name",          widget: "string"   }
      - { label: "Temple Name (Hindi/Sanskrit)", name: "hindiName",     widget: "string"   }
      - { label: "Subtitle",                     name: "subTitle",      widget: "string"   }
      - { label: "Tagline",                      name: "tagline",       widget: "string"   }
      - { label: "Sacred Mantra",                name: "mantra",        widget: "string"   }
      - { label: "Short Description",            name: "description",   widget: "text"     }
      - { label: "Location",                     name: "location",      widget: "string"   }
      - { label: "Established / Era",            name: "established",   widget: "string"   }
      - { label: "Principal Deity",              name: "deity",         widget: "string"   }
      - { label: "Founder",                      name: "founder",       widget: "string"   }
      - { label: "Temple History",               name: "templeHistory", widget: "markdown" }
      - { label: "About the Temple",             name: "aboutTemple",   widget: "markdown" }
      - { label: "Daily Timings",                name: "templeTimings", widget: "string"   }
      - { label: "Special Notes",                name: "specialNotes",  widget: "text"     }

  - name: "home-page"
    label: "Home Page"
    folder: "content/home-page"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Hero Title",       name: "heroTitle",       widget: "string"   }
      - { label: "Hero Subtitle",    name: "heroSubtitle",    widget: "string"   }
      - { label: "Hero Description", name: "heroDescription", widget: "text"     }
      - { label: "Welcome Text",     name: "welcomeText",     widget: "markdown" }
      - { label: "Button Text",      name: "buttonText",      widget: "string"   }
      - { label: "Button Link",      name: "buttonLink",      widget: "string"   }

  - name: "festivals"
    label: "Festivals"
    folder: "content/festivals"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Festival ID",       name: "id",          widget: "string"   }
      - { label: "Name (English)",    name: "name",        widget: "string"   }
      - { label: "Name (Hindi)",      name: "hindi",       widget: "string"   }
      - { label: "Month / Season",    name: "month",       widget: "string"   }
      - { label: "Tag Line",          name: "tag",         widget: "string"   }
      - { label: "Card Gradient CSS", name: "color",       widget: "string"   }
      - { label: "Card Border CSS",   name: "border",      widget: "string"   }
      - { label: "Description",       name: "description", widget: "markdown" }
      - label: "Sacred Rituals"
        name: "rituals"
        widget: "list"
        field: { label: "Ritual", name: "ritual", widget: "string" }

  - name: "gallery"
    label: "Photo Gallery"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Image ID",     name: "id",          widget: "number"   }
      - { label: "Title",        name: "title",       widget: "string"   }
      - { label: "Subtitle",     name: "subTitle",    widget: "string"   }
      - { label: "Category",     name: "category",    widget: "select",
          options: ["Architecture", "Sacred Nature", "Spiritual Grove", "Heritage"] }
      - { label: "Image",        name: "src",         widget: "image",
          media_folder: "/public/media/images/gallery",
          public_folder: "/media/images/gallery" }
      - { label: "Description",  name: "description", widget: "text"     }
      - { label: "Aspect Ratio", name: "aspect",      widget: "select",
          options: ["landscape", "portrait", "square"] }
      - { label: "Sort Order",   name: "order",       widget: "number"   }
      - label: "Highlight Tags"
        name: "highlights"
        widget: "list"
        field: { label: "Highlight", name: "highlight", widget: "string" }

  - name: "videos"
    label: "Videos"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Title",            name: "title",       widget: "string" }
      - { label: "Video File or URL",name: "src",         widget: "string" }
      - { label: "Thumbnail",        name: "thumbnail",   widget: "image", required: false,
          media_folder: "/public/media/images/temple",
          public_folder: "/media/images/temple" }
      - { label: "Duration",         name: "duration",    widget: "string", required: false }
      - { label: "Resolution",       name: "resolution",  widget: "string", required: false }
      - { label: "File Size",        name: "fileSize",    widget: "string", required: false }
      - { label: "Description",      name: "description", widget: "text"   }
      - { label: "Sort Order",       name: "order",       widget: "number" }

  - name: "music-playlist"
    label: "Music Playlist"
    folder: "content/music-playlist"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Track ID",         name: "id",          widget: "string" }
      - { label: "Title (English)",  name: "title",       widget: "string" }
      - { label: "Title (Hindi)",    name: "hindi",       widget: "string" }
      - { label: "Category",         name: "category",    widget: "string" }
      - { label: "Audio File Path",  name: "src",         widget: "string",
          hint: "/media/audio/filename.mp3" }
      - { label: "Duration",         name: "duration",    widget: "string" }
      - { label: "Duration (sec)",   name: "durationSec", widget: "number" }
      - { label: "File Size",        name: "fileSize",    widget: "string", required: false }
      - { label: "Bitrate",          name: "bitrate",     widget: "string", required: false }
      - { label: "Format",           name: "format",      widget: "string", required: false }
      - { label: "Symbol / Emoji",   name: "symbol",      widget: "string" }
      - { label: "Tag Line",         name: "tag",         widget: "string" }
      - { label: "Description",      name: "description", widget: "text"   }
      - { label: "Waveform Color",   name: "color",       widget: "string" }
      - { label: "Sort Order",       name: "order",       widget: "number" }

  - name: "contact-info"
    label: "Contact Information"
    folder: "content/contact-info"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Primary Phone",     name: "phone",            widget: "string" }
      - { label: "Alternate Phone",   name: "alternatePhone",   widget: "string" }
      - { label: "Email",             name: "email",            widget: "string" }
      - { label: "Website",           name: "website",          widget: "string" }
      - { label: "Full Address",      name: "address",          widget: "text"   }
      - { label: "GPS Coordinates",   name: "coordinates",      widget: "string" }
      - { label: "Latitude",          name: "latitude",         widget: "string" }
      - { label: "Longitude",         name: "longitude",        widget: "string" }
      - { label: "Emergency Contact", name: "emergencyContact", widget: "string" }
      - { label: "By Road",           name: "byRoad",           widget: "text"   }
      - { label: "By Train",          name: "byTrain",          widget: "text"   }
      - { label: "By Air",            name: "byAir",            widget: "text"   }
      - label: "Facilities"
        name: "facilities"
        widget: "list"
        field: { label: "Facility", name: "facility", widget: "string" }
      - label: "Etiquette Rules"
        name: "etiquette"
        widget: "list"
        field: { label: "Rule", name: "rule", widget: "string" }

  - name: "maps"
    label: "Google Maps Settings"
    folder: "content/maps"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Google Maps Search URL",     name: "googleMapsUrl",  widget: "string" }
      - { label: "Google Maps Directions URL", name: "directionsLink", widget: "string" }
      - { label: "Latitude",                   name: "latitude",       widget: "string" }
      - { label: "Longitude",                  name: "longitude",      widget: "string" }
      - { label: "Temple Marker Label",        name: "templeMarker",   widget: "string" }
      - { label: "Default Zoom Level",         name: "zoomLevel",      widget: "number" }

  - name: "social-links"
    label: "Social Links"
    folder: "content/social-links"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Facebook URL",           name: "facebook",  widget: "string" }
      - { label: "Instagram URL",          name: "instagram", widget: "string" }
      - { label: "YouTube URL",            name: "youtube",   widget: "string" }
      - { label: "WhatsApp Number or URL", name: "whatsapp",  widget: "string" }
      - { label: "Email",                  name: "email",     widget: "string" }

  - name: "images"
    label: "Featured Images"
    folder: "content/images"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Hero Image",       name: "heroImage",       widget: "image",
          media_folder: "/public/media/images/hero",
          public_folder: "/media/images/hero" }
      - { label: "Background Image", name: "backgroundImage", widget: "image", required: false,
          media_folder: "/public/media/images/backgrounds",
          public_folder: "/media/images/backgrounds" }
      - { label: "Logo / Icon",      name: "logo",            widget: "image", required: false,
          media_folder: "/public/media/images/icons",
          public_folder: "/media/images/icons" }
      - label: "Temple Photo Carousel"
        name: "templeImages"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image",
          media_folder: "/public/media/images/temple",
          public_folder: "/media/images/temple" }
      - label: "Festival Images"
        name: "festivalImages"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image",
          media_folder: "/public/media/images/festivals",
          public_folder: "/media/images/festivals" }

  - name: "theme-colors"
    label: "Theme Colors"
    folder: "content/theme-colors"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Primary Color",    name: "primary",    widget: "color", enableAlpha: false }
      - { label: "Secondary Color",  name: "secondary",  widget: "color", enableAlpha: false }
      - { label: "Gold Accent",      name: "goldAccent", widget: "color", enableAlpha: false }
      - { label: "Background Color", name: "background", widget: "color", enableAlpha: false }
      - { label: "Body Text Color",  name: "text",       widget: "color", enableAlpha: false }
      - { label: "Glow / Aura Color",name: "glow",       widget: "color", enableAlpha: false }
      - { label: "Button Color",     name: "button",     widget: "color", enableAlpha: false }

  - name: "animation-settings"
    label: "Animation Settings"
    folder: "content/animation-settings"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor: { preview: false }
    fields:
      - { label: "Rain Effect",             name: "rain",          widget: "boolean" }
      - { label: "Fog / Mist Effect",       name: "fog",           widget: "boolean" }
      - { label: "Floating Particles",      name: "particles",     widget: "boolean" }
      - { label: "Bell Swing Animation",    name: "bellAnimation", widget: "boolean" }
      - { label: "Flower Petals Drift",     name: "flowerPetals",  widget: "boolean" }
      - { label: "Fireflies (Evening)",     name: "fireflies",     widget: "boolean" }
      - { label: "Bloom / Glow PostFX",     name: "bloom",         widget: "boolean" }
      - { label: "Music Visualizer",        name: "music",         widget: "boolean" }
      - { label: "Cinematic Camera Motion", name: "cameraMotion",  widget: "boolean" }
